<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Capibara Aeronautics Launcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="titlebar" id="titlebar">
    <span class="titlebar-title">Capibara Aeronautics Launcher</span>
    <div class="titlebar-controls">
      <button id="btn-toggle-theme" title="Cambiar tema">
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
      <button id="btn-toggle-map" title="Mostrar/ocultar mapa">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
          <line x1="9" y1="3" x2="9" y2="18"/>
          <line x1="15" y1="6" x2="15" y2="21"/>
        </svg>
      </button>
      <button id="btn-minimize">&#8722;</button>
      <button id="btn-maximize">&#9723;</button>
      <button id="btn-close" class="close">&#10005;</button>
    </div>
  </div>

  <div class="main-layout">
    <!-- Panel mapa (izquierda) -->
    <div class="map-panel" id="map-panel">
      <iframe class="map-iframe" id="map-iframe" src="http://mc.capibaratraductor.com/#world:0:0:0:7567:0:0:0:0:perspective" allowfullscreen></iframe>
    </div>

    <!-- Panel launcher (derecha) -->
    <div class="launcher-panel">
      <div class="content">
        <!-- Logo -->
        <div class="header">
          <img class="logo" src="../../resources/logo.png" alt="Capibara Aeronautics" />
          <p class="subtitle">SMP · v2.1 · Minecraft 1.21.1</p>
        </div>

        <!-- Banner de actualización -->
    <div class="update-banner hidden" id="update-banner">
      <span id="update-text">Nueva versión disponible</span>
      <div class="update-actions">
        <button class="update-btn-link hidden" id="btn-changelog">Detalles</button>
        <button class="update-btn" id="btn-update">Actualizar</button>
      </div>
    </div>

    <!-- Java status -->
        <div class="java-row">
          <span class="java-status" id="java-status">Detectando Java...</span>
          <button class="java-btn hidden" id="btn-download-java">Descargar Java 21</button>
        </div>

        <!-- Username -->
        <div class="username-row">
          <div class="skin-wrap" id="skin-wrap"><img id="skin-head" class="skin-head" alt="" /></div>
          <input type="text" id="username-input" class="input" placeholder="Nombre de usuario" maxlength="16" spellcheck="false" />
        </div>

        <!-- RAM -->
        <div class="ram-row">
          <span class="ram-label">RAM</span>
          <input type="range" id="ram-slider" min="4" max="16" step="1" value="6" class="slider" />
          <span class="ram-value" id="ram-value">6 GB</span>
        </div>

        <!-- GPU -->
        <div class="gpu-row">
          <span class="gpu-label">GPU</span>
          <select id="gpu-select" class="gpu-select">
            <option value="2">Cargando...</option>
          </select>
        </div>

        <!-- Progreso -->
        <div class="progress-wrap hidden" id="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
          <p class="progress-label" id="progress-label"></p>
        </div>

        <!-- Estado del servidor -->
        <div class="server-status" id="server-status">
          <div class="server-dot" id="server-dot"></div>
          <div class="server-info">
            <span class="server-name">mc.capibaratraductor.com</span>
            <span class="server-detail" id="server-detail">Verificando...</span>
          </div>
          <span class="server-players" id="server-players"></span>
        </div>

        <!-- Botón principal -->
        <div class="play-row">
          <button class="play-btn install" id="btn-play" disabled>INSTALAR</button>
          <button class="kill-btn hidden" id="btn-kill" title="Forzar cierre del juego (se perderá progreso no guardado)">CERRAR</button>
        </div>

        <!-- Versión -->
        <div class="version-tag" id="version-tag"></div>

        <!-- Fila inferior -->
        <div class="bottom-row">
          <button class="uninstall-link hidden" id="btn-uninstall">Desinstalar</button>
          <button class="log-btn hidden" id="btn-open-dir">Abrir carpeta</button>
          <button class="log-btn hidden" id="btn-modlist">Ver mods</button>
          <div class="log-actions">
            <button class="log-btn" id="btn-copy-logs">Copiar logs</button>
            <button class="log-btn" id="btn-open-logs">Ver logs</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal changelog -->
  <div class="modal-overlay hidden" id="changelog-overlay">
    <div class="modal modal-wide">
      <h3 id="changelog-title">Novedades</h3>
      <div class="changelog-body" id="changelog-body"></div>
      <div class="modal-actions">
        <button id="changelog-close">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal modlist -->
  <div class="modal-overlay hidden" id="modlist-overlay">
    <div class="modal modal-wide">
      <h3>Mods instalados <span class="modlist-count" id="modlist-count"></span></h3>
      <input type="text" class="input" id="modlist-search" placeholder="Buscar mod..." />
      <div class="modlist-body" id="modlist-body"></div>
      <div class="modal-actions">
        <button id="modlist-close">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal desinstalar -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <p>¿Desinstalar el modpack? Se borrarán mods y configs (los saves se conservan).</p>
      <div class="modal-actions">
        <button id="modal-cancel">Cancelar</button>
        <button id="modal-confirm" class="danger">Desinstalar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
